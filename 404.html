<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 - 页面未找到 · 阿布</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/css/style.css">
    <meta name="theme-color" content="#08090d">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #08090d;
            box-sizing: border-box;
        }
        .error-card {
            max-width: 480px;
            width: 100%;
            padding: 40px 28px;
            text-align: center;
            border-radius: 16px;
            box-sizing: border-box;
        }
        .error-code {
            font-size: 72px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #60a5fa 0%, #3b82f6 50%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 12px;
        }
        .error-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #9ca3af;
            margin-bottom: 28px;
            word-break: break-word;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-actions .btn-primary,
        .error-actions .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            min-width: 0;
            box-sizing: border-box;
        }
        @media (max-width: 480px) {
            .error-actions {
                flex-direction: column;
                width: 100%;
            }
            .error-actions .btn-primary,
            .error-actions .btn-secondary {
                width: 100%;
            }
        }
    </style>
</head>
<body class="site-body">
    <main class="error-page">
        <div class="error-card liquid-glass">
            <div class="error-code">404</div>
            <h1 class="error-title">该页面不在生产环境中</h1>
            <p class="error-desc">你访问的链接可能已被移除、重命名，或者地址输入有误。你可以返回主页查看全部 AI 生产落地案例与解决方案。</p>
            <div class="error-actions">
                <a href="/" class="btn-primary">返回主页</a>
                <a href="/#showcase" class="btn-secondary">查看落地案例</a>
            </div>
        </div>
    </main>
</body>
</html>
