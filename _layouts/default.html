<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    {% include seo-head.html %}
    <link rel="alternate" type="text/plain" href="{{ '/llms.txt' | relative_url }}" title="LLM site summary">
    {% include json-ld.html %}
    <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicon-32.png' | relative_url }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
    <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <meta name="apple-mobile-web-app-title" content="阿布">
    <meta name="theme-color" content="#08090d">
</head>
<body class="site-body">
    {{ content }}
    <script>window.siteConfig = null;</script>
    <script defer src="{{ '/assets/vendor/vue.global.prod.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/app-core.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
