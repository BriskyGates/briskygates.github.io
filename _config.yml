# Jekyll 配置文件
title: "阿布软件工作室 · 一人公司（OPC）"
description: "阿布在上海经营一人公司（OPC），开发 Glide 和 CrossLeads 搜买家，也为企业做研报检索、文档解析和自动对账。"
url: https://briskygates.github.io
baseurl: ""
author: 阿布
lang: zh-CN

# Google Search Console 验证（在 Search Console 获取 meta 内容后填入，留空则不输出）
google_site_verification: "googleba2439275fc52107"

# 构建设置
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed

# 主题设置（使用空白主题，自定义样式）
theme: null

# 排除文件（避免无关页面进入 sitemap）
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - DEPLOY.md
  - README.md
  - tests/
  - scripts/
  - package.json
  - package-lock.json
  - playwright.config.js
  - .github/

# 包含文件（纯静态，不经 Jekyll 模板渲染）
include:
  - _pages
  - 404.html
  - sitemap.xml
  - robots.txt
  - llms.txt
  - llms-full.txt
  - llms-full.en.txt

# 默认设置
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "assets"
    values:
      sitemap: false
